name: Render and publish

# Runs when scripts, the episode list, the voices or the audition request change,
# and once on Saturday evening (after Shabbat) to catch anything queued while it was paused.
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "episodes/index.json"
      - "voices.json"
      - "config.json"
      - "audition/request.json"
      - "audition/candidates.json"
      - "tools/**"
      - ".github/workflows/render.yml"
  schedule:
    - cron: "5 21 * * 6"
    - cron: "20 8 * * *"      # every day after Google's daily reset: makes any episode left waiting for speech allowance
    - cron: "*/30 7-22 * * *" # every half hour in the day: an episode cut short by Google's limit carries on by itself
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sqe1-listen
  cancel-in-progress: false

jobs:
  check:
    # a scheduled run with nothing waiting stops here: no runner set-up, no deployment
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.todo.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: todo
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && ! python3 -c "import json,sys; d=json.load(open('episodes/index.json')); sys.exit(0 if any(e.get('status') == 'queued' for e in d.get('episodes', [])) else 1)"; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "nothing is waiting"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  render:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Bring back chunks made by earlier runs
        uses: actions/cache/restore@v4
        with:
          path: chunk-cache
          key: chunks-${{ github.run_id }}
          restore-keys: chunks-

      - name: Render audio and build the site
        id: run
        continue-on-error: true
        timeout-minutes: 35        # a stuck run still saves its trace (the next steps always run)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TTS_WORKERS: "5"
          ISOLATE_CHUNKS: "1"      # each two-voice chunk in its own process, killed if it hangs
          CHUNK_CACHE_DIR: chunk-cache   # chunks already made are reused when a run is cut short
        run: python tools/run.py

      - name: Keep made chunks for the next run (the last two days only)
        if: always()
        run: |
          mkdir -p chunk-cache
          find chunk-cache -type f -mtime +2 -delete || true
          du -sh chunk-cache || true

      - name: Save the chunk store
        if: always() && steps.run.outputs.skipped != 'true'
        uses: actions/cache/save@v4
        with:
          path: chunk-cache
          key: chunks-${{ github.run_id }}

      - name: Save new audio and episode list
        if: always() && steps.run.outputs.skipped != 'true'
        run: |
          git config user.name "sqe1-listen[bot]"
          git config user.email "sqe1-listen-bot@users.noreply.github.com"
          git add -A episodes audition reports
          if git diff --cached --quiet; then
            echo "nothing new to save"
          else
            git commit -q -m "Render: new audio and episode list"
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5
        if: steps.run.outputs.skipped != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.skipped != 'true'
        with:
          path: _site

      - id: deployment
        if: steps.run.outputs.skipped != 'true'
        uses: actions/deploy-pages@v4

      - name: Fail the run if any episode failed to render
        if: steps.run.outcome == 'failure'
        run: |
          echo "Some episodes failed: ${{ steps.run.outputs.failed }}"
          exit 1
